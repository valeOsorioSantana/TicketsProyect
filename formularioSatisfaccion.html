<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario satisfaccion | TicketLite</title>
    <link href="css/formularioSatisfaccion.css" rel="stylesheet" />
</head>
<body>
 <div class="feedback-container">
        <h3>¿Cómo fue tu experiencia?</h3>
        <form id="feedback-form">
            <div class="rating">
                <label>Tu calificación:</label>
                <div class="stars">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <div class="rating-feedback" id="rating-feedback"></div>
            </div>
            
            <div class="form-group">
                <label for="comments">Cuéntanos más:</label>
                <div class="textarea-container">
                    <textarea 
                        id="comments" 
                        placeholder="Comparte tu experiencia con nosotros... ¿Qué te gustó más? ¿Hay algo que podríamos mejorar?"
                        maxlength="500"
                    ></textarea>
                    <div class="char-counter" id="char-counter">0/500</div>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submit-btn">
                Enviar respuesta
            </button>
        </form>
    </div>

    <div class="success-message" id="success-message">
        ¡Gracias por tu respuesta! 🎉
    </div>
 <script src="js/formularioSatisfaccion.js"></script>
</body>
</html>
