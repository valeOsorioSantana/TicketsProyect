<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistencia al Evento | TicketLite</title>
  <link rel="stylesheet" href="css/registroEvento.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="shortcut icon" href="./img/entradas.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <main>
    <div class="volver-container">
      <a href="userEvents.html" class="btn-volver">
        <i class="fa-solid fa-house"></i> Volver al inicio
      </a>
    </div>


    <h2>Confirmar Asistencia</h2>
    <p class="subtitulo">Por favor ingresa los datos requeridos para guardar tu asistencia</p>

    <form id="registroForm">
      <!-- ID del evento -->
      <input type="hidden" id="eventId" />

      <!-- Tipo de entrada -->
      <div>
        <label for="ticketType">Tipo de entrada:</label>
        <select id="ticketType" name="ticketType" required>
          <option value="">Seleccione tipo</option>
          <option value="General">General</option>
          <option value="VIP">VIP</option>
          <option value="Platino">Platino</option>
        </select>
      </div>

      <!-- Precio -->
      <label for="quantity">Cantidad de entradas:</label>
      <input type="number" id="quantity" name="quantity" value="1" min="1" required />

      <label for="price">Precio total:</label>
      <input type="text" id="price" name="price" readonly />

      <!-- Estado oculto: pendiente inicialmente -->
      <input type="hidden" id="status" value="Pendiente" />

      <!-- Botones de acción -->
      <div class="btn-group">
        <button type="button" id="btnConfirmar">
          <i data-feather="check-circle"></i> Confirmar
        </button>

        <button type="button" id="btnCancelar">
          <i data-feather="x-circle"></i> Cancelar
        </button>

        <a onclick="history.back()" class="btn-volver">
          <i data-feather="arrow-left"></i> Página anterior
        </a>
      </div>
    </form>

    <!-- Sección de mensajes opcional -->
    <div id="mensaje" role="alert" style="margin-top: 1rem;"></div>
  </main>

  <!-- JS -->
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="js/registroEvento.js"></script>
  <script>feather.replace()</script>

</body>

</html>
