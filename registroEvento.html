<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro a Evento</title>
  <link rel="stylesheet" href="css/formulario.css" />
</head>
<body>
  <h2>Registro al Evento</h2>
  <form id="registroForm">
    <input type="hidden" id="eventId" />
    <div>
      <label for="ticketType">Tipo de entrada:</label>
      <select id="ticketType" required>
        <option value="">Seleccione una opción</option>
        <option value="GENERAL">General</option>
        <option value="VIP">VIP</option>
        <option value="PLATINO">Platino</option>
      </select>
    </div>

    <div>
      <label for="price">Precio:</label>
      <input type="number" id="price" placeholder="Ej: 100.00" required />
    </div>

    <div>
      <label for="status">Estado del registro:</label>
      <select id="status" required>
        <option value="CONFIRMADO">Confirmado</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="CANCELADO">Cancelado</option>
      </select>
    </div>

    <button type="submit">Registrar</button>
  </form>

  <script src="js/registroEvento.js"></script>
</body>
</html>
