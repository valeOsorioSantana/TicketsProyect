<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro a Evento</title>
  <link rel="stylesheet" href="css/registroEvento.css" />
</head>

<body>
  <main>
    <div class="volver-container">
      <a href="userEvents.html" class="btn-volver">🏠 Volver al inicio</a>
    </div>

    <h2>Registro al Evento</h2>

    <form id="registroForm">
      <!-- ID del evento -->
      <input type="hidden" id="eventId" />

      <!-- Tipo de entrada -->
      <div>
        <label for="ticketType">Tipo de entrada:</label>
        <select id="ticketType" name="ticketType" required>
          <option value="">Seleccione tipo</option>
          <option value="General">General</option>
          <option value="VIP">VIP</option>
          <option value="Platino">Platino</option>
        </select>
      </div>

      <!-- Precio -->
      <label for="quantity">Cantidad de entradas:</label>
      <input type="number" id="quantity" name="quantity" value="1" min="1" required />

      <label for="price">Precio total:</label>
      <input type="text" id="price" name="price" readonly />

      <!-- Estado oculto: pendiente inicialmente -->
      <input type="hidden" id="status" value="Pendiente" />

      <!-- Botones de acción -->
      <div class="btn-group">
        <button type="button" id="btnConfirmar">✅ Confirmar Registro</button>
        <button type="button" id="btnCancelar">❌ Cancelar Registro</button>
        <button onclick="history.back()" class="btn-volver">🔙 Página anterior</button>
      </div>
    </form>

    <!-- Sección de mensajes opcional -->
    <div id="mensaje" role="alert" style="margin-top: 1rem;"></div>
  </main>

  <!-- JS -->
  <script src="js/registroEvento.js"></script>
</body>

</html>
