<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Clasificador de Intenciones con TensorFlow.js</title>
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0/dist/tf.min.js"></script>
    <!-- Universal Sentence Encoder -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder@1.3.3/dist/universal-sentence-encoder.min.js"></script>
    <!-- Nuestro JS separado -->
    <script src="./js/app.js"></script>
</head>

<body>
    <h2>Clasificador de Intenciones</h2>
    <input type="text" id="pregunta" placeholder="Escribe tu pregunta" size="50">
    <button onclick="predecir()">Predecir Intención</button>
    <p id="resultado"></p>
</body>

</html>
