<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comprar Entrada | TicketLite</title>

  <!-- Estilos externos -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="css/compra.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <main class="compra-container">
    <!-- Contenedor para título + botón -->
    <div class="header-with-button">
      <h1 id="eventTitle">Cargando evento...</h1>
      <button class="btn-ver-eventos"><i class="fas fa-calendar-alt icon"></i> Ver Eventos</button>
    </div>

    <!-- Detalles del evento -->
    <section id="eventDetails">
      <p>Cargando detalles...</p>
    </section>

    <!-- Mapa del evento -->
    <section id="seatingMapContainer" style="display: none; margin-top: 20px;">
      <h3>🗺️ Mapa del lugar</h3>
      <img id="seatingMapImage" alt="Mapa del estadio o recinto"
        style="max-width: 100%; border-radius: 8px; margin-bottom: 15px;" />
    </section>

    <!-- Indicador de carga del formulario -->
    <div id="cargandoPago" style="margin-top: 30px; font-weight: bold;">
      🔄 Cargando inscripción y formulario de pago...
    </div>

    <!-- Sección de pago directa -->
    <section id="pagoForm" style="margin-top: 40px; display: none;">
      <h2>💳 Compra de Entradas</h2>
      <form id="formPago">
        <!-- Tipo de entrada -->
        <label for="ticketType">Tipo de entrada:</label>
        <select id="ticketType" name="ticketType" disabled required>
          <option value="GENERAL">GENERAL</option>
          <option value="VIP">VIP</option>
          <option value="PLATINO">PLATINO</option>
        </select>

        <!-- Cantidad -->
        <label for="cantidad">Cantidad de entradas:</label>
        <input type="number" id="cantidad" name="cantidad" min="1" value="1" disabled required />

        <!-- Método de pago -->
        <label for="method">Método de pago:</label>
        <select id="method" name="method" required>
          <option value="">Seleccione método</option>
          <option value="PSE">PSE</option>
          <option value="Tarjeta de crédito">Tarjeta de crédito</option>
          <option value="Tarjeta de débito">Tarjeta de débito</option>
          <option value="PayPal">PayPal</option>
        </select>

        <!-- Campos simulados para tarjeta -->
        <div id="cardFields" style="display: none; margin-top: 10px;">
          <label for="cardNumber">Número de tarjeta:</label>
          <input type="text" id="cardNumber" name="cardNumber" maxlength="19" placeholder="1234 5678 9012 3456" />

          <label for="cardName">Nombre del titular:</label>
          <input type="text" id="cardName" name="cardName" placeholder="Nombre en la tarjeta" />

          <label for="cardExpiry">Fecha de vencimiento:</label>
          <input type="month" id="cardExpiry" name="cardExpiry" />

          <label for="cardCVV">CVV:</label>
          <input type="text" id="cardCVC" name="cardCVC" maxlength="4" placeholder="123" />
        </div>

        <!-- Campos adicionales para PSE -->
        <div id="pseFields" style="margin-top: 15px; display: none;">
          <label for="psePersonType">Tipo de persona:</label>
          <select id="psePersonType" required>
            <option value="">Seleccione tipo</option>
            <option value="natural">Persona natural</option>
            <option value="juridica">Persona jurídica</option>
          </select>

          <label for="pseDocumentType">Tipo de documento:</label>
          <select id="pseDocumentType" required>
            <option value="CC">Cédula de ciudadanía</option>
            <option value="CE">Cédula de extranjería</option>
            <option value="NIT">NIT</option>
          </select>

          <label for="pseDocumentNumber">Número de documento:</label>
          <input type="text" id="pseDocumentNumber" required />

          <label for="pseBank">Banco:</label>
          <select id="pseBank" required>
            <option value="">Seleccione banco</option>
            <option value="banco-bogota">Banco de Bogotá</option>
            <option value="bancolombia">Bancolombia</option>
            <option value="davivienda">Davivienda</option>
            <option value="nequi">Nequi</option>
          </select>

          <label for="pseName">Nombre del titular:</label>
          <input type="text" id="pseName" required />

          <label for="pseEmail">Correo electrónico:</label>
          <input type="email" id="pseEmail" required />
        </div>

        <!-- Campos simulados para PayPal -->
        <div id="paypalFields" style="display: none; margin-top: 15px;">
          <label for="paypalEmail">Correo de PayPal:</label>
          <input type="email" id="paypalEmail" name="paypalEmail" placeholder="usuario@paypal.com">

          <label for="paypalPassword">Contraseña de PayPal:</label>
          <input type="password" id="paypalPassword" name="paypalPassword" placeholder="********">
        </div>

        <!-- Monto calculado (se muestra en el resumen) -->
        <p id="resumenPago" style="margin-top: 10px;"></p>

        <!-- Monto oculto -->
        <input type="hidden" id="amount" name="amount" value="0" />

        <div class="btn-group">
          <button type="submit" class="btn btn-pago">
            💳 Pagar
          </button>
          <button id="btnCancelarCompra" type="button" class="btn btn-cancelar">
            ❌ Cancelar compra
          </button>
        </div>
      </form>
      <div id="mensajePago" class="mensaje" style="margin-top: 10px;"></div>

      <div id="ticketSimulado" class="ticket-simulado">
        <h3>🎟️ Entrada para <span id="simEventoNombre"></span></h3>
        <p><strong>📍 Lugar:</strong> <span id="simEventoLugar"></span></p>
        <p><strong>📅 Fecha:</strong> <span id="simEventoFecha"></span></p>
        <p><strong>👤 Usuario:</strong> <span id="simUsuarioEmail"></span></p>
        <p><strong>🎟️ Tipo de Entrada:</strong> <span id="simTipoEntrada"></span></p>
        <p><strong>🔢 Cantidad:</strong> <span id="simCantidad"></span></p>
        <p><strong>💰 Precio Total:</strong> $<span id="simPrecioTotal"></span></p>
        <canvas id="qrPreview"></canvas>
      </div>
    </section>
    <div class="ticket-btn-wrapper">
      <button id="verMisTicketsBtn" class="btn-ver-tickets">🎟️ Ver mis tickets</button>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/comprar.js"></script>
</body>

</html>
