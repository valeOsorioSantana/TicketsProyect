<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Encuesta de Satisfacción</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/encuesta.css" />
</head>
<body>

  <div class="encuesta-container">
    <h2 class="form-title">Encuesta de Satisfacción del Evento</h2>
    
    <form id="encuestaForm">
      <!-- Se elimina campo nombreEvento porque no es necesario en backend -->
      
      <div class="form-group">
        <label>¿Cómo calificarías tu experiencia general?</label>
        <div class="rating text-center">
          <input type="radio" name="rating" id="star5" value="5" /><label for="star5">★</label>
          <input type="radio" name="rating" id="star4" value="4" /><label for="star4">★</label>
          <input type="radio" name="rating" id="star3" value="3" /><label for="star3">★</label>
          <input type="radio" name="rating" id="star2" value="2" /><label for="star2">★</label>
          <input type="radio" name="rating" id="star1" value="1" /><label for="star1">★</label>
        </div>
      </div>

      <div class="form-group">
        <label for="comentarios">¿Qué te gustó o qué podemos mejorar?</label>
        <textarea class="form-control" id="comentarios" rows="4" placeholder="Escribe tus comentarios aquí..."></textarea>
      </div>

      <!-- Se elimina campo recomendacion porque no lo manejamos -->

      <button type="submit" class="btn btn-primary btn-block">Enviar Encuesta</button>
    </form>
  </div>

  <script src="/js/encuesta.js"></script>
</body>
</html>
