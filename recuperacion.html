<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar Contraseña | TicketLite</title>

    <!-- Bootstrap + Estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="shortcut icon" href="./img/entradas.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/recuperacion.css" />
</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card recovery-card shadow-lg w-100" style="max-width: 960px;">
            <div class="row no-gutters">
                <!-- Panel izquierdo: imagen -->
                <div class="col-lg-6 d-none d-lg-block left-panel">
                    <img src="img/recovery-cat.png" alt="Ilustración de recuperación" class="img-fluid w-100 h-100"
                        style="object-fit: cover;">
                </div>

                <!-- Panel derecho: formulario -->
                <div class="col-lg-6">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h3 class="text-primary font-weight-bold">¿Olvidaste tu contraseña?</h3>
                            <p class="text-muted small">No te preocupes, te ayudamos a recuperarla.</p>
                        </div>

                        <!-- Vista 1 -->
                        <div id="view-request">
                            <form id="recoverForm">
                                <div class="form-group">
                                    <label for="email">Correo electrónico</label>
                                    <input type="email" class="form-control" id="email" placeholder="Ingresa tu email"
                                        required />
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">Enviar enlace de
                                    recuperación</button>
                            </form>
                        </div>

                        <!-- Vista 2 -->
                        <div id="view-validate" style="display: none;">
                            <div class="text-center mb-4">
                                <h2 class="text-primary font-weight-bold">🔐 Validar Token</h2>
                                <p class="text-muted small">Ingresa el código que te enviamos por correo para continuar.
                                </p>
                            </div>

                            <form id="validateForm">
                                <div class="form-group">
                                    <label for="token" class="font-weight-semibold">Token de recuperación</label>
                                    <input type="text" class="form-control form-control-lg rounded-pill px-4" id="token"
                                        placeholder="Ingresa el token recibido" required />
                                </div>

                                <button type="submit" class="btn btn-gradient btn-block rounded-pill font-weight-bold">
                                    Validar token
                                </button>
                            </form>
                        </div>

                        <!-- Vista 3 -->
                        <div id="view-reset" style="display:none;">
                            <form id="resetForm">
                                <div class="form-group">
                                    <label for="newPassword" class="font-weight-semibold">Nueva contraseña</label>
                                    <input type="password" class="form-control form-control-lg rounded-pill px-4"
                                        id="newPassword" placeholder="Nueva contraseña" required />
                                </div>

                                <div class="form-group">
                                    <label for="confirmPassword" class="font-weight-semibold">Confirmar
                                        contraseña</label>
                                    <input type="password" class="form-control form-control-lg rounded-pill px-4"
                                        id="confirmPassword" placeholder="Confirmar contraseña" required />
                                </div>

                                <button type="submit" class="btn btn-gradient btn-block rounded-pill font-weight-bold">
                                    Cambiar contraseña
                                </button>
                            </form>
                        </div>

                        <div id="message" class="mt-3"></div>

                        <div class="text-center mt-3">
                            <a href="login.html" class="text-primary small">Volver al inicio de sesión</a>
                        </div>
                        <p class="text-center mt-4 text-muted small">© 2025 TicketLite. Todos los derechos reservados.

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="/js/recuperacion.js"></script>
</body>

</html>
