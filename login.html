<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Login | TicketLite</title>

    <!-- Fonts & Icons -->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,700,900" rel="stylesheet" />
    <link rel="shortcut icon" href="./img/entradas.png" type="image/x-icon" />

    <!-- SB Admin + Custom styles -->
    <link href="css/sb-admin-2.min.css" rel="stylesheet" />
    <link href="css/login.css" rel="stylesheet" />
</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card login-card shadow-lg w-100" style="max-width: 960px;">
            <div class="row no-gutters">
                <!-- Panel izquierdo con imagen ilustrativa -->
                <div class="col-lg-6 left-panel d-none d-lg-flex">
                    <img src="img/login-illustration.jpeg" alt="Ilustración de acceso" class="img-fluid w-100 h-100"
                        style="object-fit: contain;" />
                </div>

                <!-- Panel derecho con formulario -->
                <div class="col-lg-6 d-flex align-items-center">
                    <div class="card-body w-100 px-5">
                        <div class="logo-container">
                            <img src="img/Logo.png" alt="TicketLite Logo" class="logo">
                        </div>

                        <div class="text-center mb-4">
                            <h1 class="h4 text-primary font-weight-bold">¡Bienvenido a TicketLite! 🎟️</h1>
                            <p class="text-muted small">Accede para explorar conciertos, ferias y eventos exclusivos.
                            </p>
                        </div>

                        <form class="user">
                            <div class="form-group">
                                <input type="email" class="form-control form-control-user" id="txtEmail"
                                    placeholder="Ingresa tu Email" />
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control form-control-user" id="txtPassword"
                                    placeholder="Password" />
                            </div>
                            <a onclick="iniciarSesion()" href="#" class="btn btn-primary btn-user btn-block">
                                Iniciar Sesión
                            </a>
                            <div class="text-center mt-3">
                                <a href="recuperacion.html" class="small text-primary">¿Olvidaste tu contraseña?</a>
                            </div>
                        </form>

                        <hr />
                        <div class="text-center">
                            <a class="small text-dark" href="register.html">Crear Cuenta</a>
                        </div>
                        <p class="text-center mt-4 text-muted small">© 2025 TicketLite. Todos los derechos reservados.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
